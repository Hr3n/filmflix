name: Update Streaming Catalog

on:
  # Runs automatically every 12 hours
  schedule:
    - cron: '0 */12 * * *'
  
  # Allows you to run this workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    # Give the Action permission to write back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        # This navigates to the aggregator folder and runs your Python script
        run: |
          cd aggregator
          python scraper.py

      - name: Commit and Push changes
        run: |
          # Configure Git to commit as a GitHub Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if catalog.json has changed
          git add ../web/public/catalog.json
          
          # Only commit and push if there are actual changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update catalog.json" && git push)
